name: CI - Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run Tests
      run: npm test

    - name: Install Pkg
      run: npm install -g pkg

    - name: Verify Build (Dry Run)
      run: pkg . --targets node18-win-x64 --output MusicApp.exe --public
      
    - name: Check Build Output
      run: ls -lh MusicApp.exe