name: CI - Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege: these jobs only read the repo to build and test it.
permissions:
  contents: read

jobs:
  backend:
    # Stage 3: the desktop app ships for macOS and Windows, so the server
    # (native sqlite3, ffmpeg-static, path handling) is tested on both, plus Linux.
    name: backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      # --ignore-scripts skips ffmpeg-static's postinstall, which downloads an
      # ffmpeg binary from GitHub releases. Nothing in CI transcodes audio (tests
      # stub ffmpeg, the smoke test only boots the server), and that download
      # failing with 504 used to fail the whole job. There are no native addons
      # left to build: the database is Node's built-in node:sqlite.
      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Run Tests
        run: npm test

      # Production dependencies only; dev tooling (pkg, tauri cli) is not shipped.
      - name: Audit production dependencies
        if: matrix.os == 'ubuntu-latest'
        run: npm audit --omit=dev --audit-level=high

      # Prove the app that actually ships can boot (the test suite alone would not
      # catch a missing dependency or a broken require in server.js).
      - name: Smoke test server boot
        env:
          JWT_SECRET: ci-smoke-secret-ci-smoke-secret-1234
          PORT: 3987
          YTDLP_AUTO_UPDATE: 'false'
        run: |
          node server.js &
          SRV=$!
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:3987/ > /dev/null; then
              echo "Server booted."; kill $SRV; exit 0
            fi
            sleep 0.5
          done
          echo "Server failed to boot in time"; kill $SRV 2>/dev/null; exit 1

  client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: npm ci
        working-directory: client

      - name: Lint Client
        run: npx eslint src
        working-directory: client

      - name: Audit client production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: client

      - name: Build Client
        run: npm run build
        working-directory: client
