name: CI - Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run Tests
        run: npm test

      # Prove the app that actually ships can boot (the test suite alone would not
      # catch a missing dependency or a broken require in server.js).
      - name: Smoke test server boot
        env:
          JWT_SECRET: ci-smoke-secret-ci-smoke-secret-1234
          PORT: 3987
        run: |
          node server.js &
          SRV=$!
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3987/ > /dev/null; then
              echo "Server booted."; kill $SRV; exit 0
            fi
            sleep 0.5
          done
          echo "Server failed to boot in time"; kill $SRV 2>/dev/null; exit 1

  client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: npm ci
        working-directory: client

      - name: Lint Client
        run: npx eslint src
        working-directory: client

      - name: Build Client
        run: npm run build
        working-directory: client
