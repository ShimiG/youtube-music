name: Build desktop installers

# Builds the installable desktop app for macOS (Apple Silicon, .dmg) and
# Windows (x64, .msi and setup .exe): the Tauri shell with the API server
# (single executable), ffmpeg and yt-dlp bundled inside. Nothing else has to
# be installed to run it.
#
# - On a published release: the installers are attached to the release.
# - Run by hand (Actions tab -> Run workflow): the installers are available
#   as artifacts of the run, to test before publishing anything.
#
# The apps are not notarised / code-signed with a paid certificate; see
# docs/packaging.md ("Installing an unsigned build").

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A full build takes 10 to 20 minutes; a stalled one must not run for hours.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            ytdlp: yt-dlp_macos
            installers: |
              src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            ytdlp: yt-dlp.exe
            installers: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix client

      # Do not publish an app that fails its own tests.
      - name: Run Tests
        run: npm test

      # The static ffmpeg build ships inside the app. Its download (GitHub
      # releases) has been flaky, so retry instead of failing the release.
      - name: Fetch ffmpeg (ffmpeg-static)
        run: |
          for i in 1 2 3 4 5; do
            node node_modules/ffmpeg-static/install.js && exit 0
            echo "ffmpeg download failed (attempt $i), retrying in $((i * 15))s"; sleep $((i * 15))
          done
          exit 1

      - name: Fetch yt-dlp
        run: |
          mkdir -p bin
          curl -fL --retry 5 --retry-delay 10 -o "bin/${{ matrix.ytdlp }}" \
            "https://github.com/yt-dlp/yt-dlp/releases/latest/download/${{ matrix.ytdlp }}"
          chmod +x "bin/${{ matrix.ytdlp }}"

      # Server as a single executable, with ffmpeg and yt-dlp staged next to it
      # under Tauri's externalBin names. All three must exist, or the app
      # would install fine and then play nothing.
      - name: Build server executable
        run: |
          npm run build:server
          ls -la bin/
          for b in music-server ffmpeg yt-dlp; do
            ls bin/$b-*-* > /dev/null 2>&1 || { echo "::error::bin/$b-<target> is missing"; exit 1; }
          done

      - name: Build client
        run: npm run build --prefix client

      - name: Build desktop app
        run: npx tauri build

      - name: List installers
        run: ls -la src-tauri/target/release/bundle/*/ || true

      - name: Upload installers (run artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: music-manager-${{ matrix.os }}
          path: ${{ matrix.installers }}
          if-no-files-found: error

      - name: Attach installers to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.installers }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
