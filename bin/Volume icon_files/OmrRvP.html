<style>
.sound {
  width: 250px;
  height: 250px;
  position: relative;
  cursor: pointer;
  display: inline-block;
}
.sound-icon {
  color: #fff;
  width: 75%;
  height: 100%;
  line-height: 100%;
  font-size: 250px;
  display: block;
  margin: auto;
}
.sound-wave {
  position: absolute;
  border: 15.625px solid transparent;
  border-right: 15.625px solid #fff;
  border-radius: 50%;
  transition: all 200ms;
  margin: auto;
  top: 0;
  bottom: 0;
  left: 0;
  right: 0;
}
.sound-wave_one {
  width: 50%;
  height: 50%;
  transition: all 0.2s cubic-bezier(0.26, -0.01, 0, 1.28);
}
.sound-wave_two {
  width: 75%;
  height: 75%;
  transition: all 0.2s cubic-bezier(0.26, 0.1, 0, 1.49);
}
.sound-mute .sound-wave {
  border-radius: 50%;
  width: 0%;
  height: 0%;
  border-width: 0 15.625px 0 0;
}
.sound-mute .sound-wave_one {
  transform: translateX(-10px);
}
.sound-mute .sound-wave_two {
  transform: translateX(-10px);
}

body {
  margin: 20px;
  background: black;
}
</style>
